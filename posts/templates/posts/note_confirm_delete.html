{% extends "base.html" %}
{% block title %}Delete {{ note.title }} | Sticky Notes{% endblock %}
{% block content %}
<section class="form-card confirm-card">
  <p class="eyebrow">PLEASE CONFIRM</p><h1>Delete this note?</h1>
  <p>Are you sure you want to delete <strong>{{ note.title }}</strong>? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="button button-danger" type="submit">Yes, delete note</button>
      <a class="button button-muted" href="{% url 'note_detail' note.pk %}">Keep note</a>
    </div>
  </form>
</section>
{% endblock %}
